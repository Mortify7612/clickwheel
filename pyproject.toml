[project]
name = "clickwheel"
version = "0.1.0"
description = "Download YouTube Music playlists into a tagged library and sync them to any iPod"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deno>=2.9.7",
    "mutagen>=1.48.1",
    "pillow>=13.0.0",
    "platformdirs>=4.13.5",
    "psutil>=7.2.2",
    "pypodlib[artwork]==0.1.0",
    "pyside6-addons==6.12.0",
    "pyside6-essentials>=6.12.0",
    "requests>=2.34.2",
    "yt-dlp[default]>=2026.8.19",
    "ytmusicapi>=1.12.3",
]

[project.scripts]
clickwheel = "clickwheel:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]
