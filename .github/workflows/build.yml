name: Build

# Tests run on every push. Installers are built on demand (Actions tab ->
# Build -> Run workflow) or when a version tag like v0.2.0 is pushed, since
# macOS runner minutes are billed at 10x on private repos.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The libraries after ffmpeg are what PySide6 needs to load its GUI and
      # multimedia modules; the runner image doesn't ship libEGL.
      - run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          ffmpeg libchromaprint-tools
          libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0t64 libpulse0 libxrandr2
      - run: uv sync --locked
      - run: uv run pytest -q

  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macos-arm64
          - os: macos-15-intel
            name: macos-intel
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-22.04  # older glibc so the build runs on more distros
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Same Qt libraries as the test job (22.04 names), so the tests can import PySide6.
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0 libpulse0 libxrandr2
      - run: uv sync --locked
      # Static fpcalc (song matching), shipped inside the app.
      - run: uv run python -m clickwheel.tools fetch-fpcalc

      # Tests that need ffmpeg skip themselves where it isn't installed.
      - run: uv run pytest -q

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: printf '__version__ = "%s"\n' "${GITHUB_REF_NAME#v}" > src/clickwheel/_version.py

      - run: uv run pyinstaller --noconfirm --distpath dist --workpath build packaging/clickwheel.spec

      - name: Smoke-test the frozen app
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS)   exe=dist/Clickwheel.app/Contents/MacOS/Clickwheel ;;
            Windows) exe=dist/Clickwheel/Clickwheel.exe ;;
            *)       exe=dist/Clickwheel/Clickwheel ;;
          esac
          "$exe" devices
          "$exe" logout

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: hdiutil create -volname Clickwheel -srcfolder dist/Clickwheel.app -ov -format UDZO "Clickwheel-${{ matrix.name }}.dmg"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/Clickwheel -DestinationPath "Clickwheel-${{ matrix.name }}.zip"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "Clickwheel-${{ matrix.name }}.tar.gz" -C dist Clickwheel

      - uses: actions/upload-artifact@v4
        with:
          name: Clickwheel-${{ matrix.name }}
          path: Clickwheel-${{ matrix.name }}.*
          if-no-files-found: error

  # Installers go to the public releases repo (the source repo is private) so the
  # app's built-in updater can download them without a GitHub login.
  # Requires secret RELEASES_TOKEN: fine-grained token with Contents read/write
  # on Mortify7612/clickwheel-releases only.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check token
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          [ -n "$RELEASES_TOKEN" ] || { echo "::error::Add the RELEASES_TOKEN secret (see workflow comment)"; exit 1; }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release notes from the tag message
        run: |
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          [ -s notes.md ] || echo "Clickwheel $GITHUB_REF_NAME" > notes.md
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum Clickwheel-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          repository: Mortify7612/clickwheel-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Clickwheel ${{ github.ref_name }}
          body_path: notes.md
          files: |
            assets/Clickwheel-*
            assets/SHA256SUMS.txt
